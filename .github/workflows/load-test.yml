name: load-test
on: [pull_request, workflow_dispatch]
jobs:
  goose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Load testing your own staging site? Delete this step and set
      # --host "${{ vars.STAGING_URL }}" below instead (see README.md).
      - name: Start Drupal Umami on this runner and warm it up
        run: ./site/up.sh
      - name: Run the load test with pass/fail rules
        run: |
          cargo run --release -- \
            --host "http://localhost:8080" \
            --users 50 --increase-rate 10 --run-time 2m \
            --quiet --threshold "p95<500ms" --threshold "error-rate<1%" \
            --report-file report.html
      - name: Keep the report, pass or fail
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: goose-report
          path: report.html
